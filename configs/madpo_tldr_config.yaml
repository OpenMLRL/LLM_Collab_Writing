agent_model:
  name: Qwen/Qwen3-1.7B
  type: qwen
  temperature: 0.7
  top_p: 0.9
  top_k: null
  special_tokens: {}
  torch_dtype: auto

agents: null

dataset:
  name: trl-lib/tldr
  type: tldr
  train_split: train[:200]
  eval_split: test[:200]

tokenizer:
  padding_side: left

seed: 42

output:
  base_dir: output_madpo_tldr
  verbose: false
  save_final_model: false

madpo:
  parallel_training: none
  agent_devices:
  - cuda:0
  num_agents: 2
  num_turns: 1
  num_train_epochs: 8
  agent_learning_rate: 5.0e-06
  logging_steps: 50
  preference_num_candidates: 20
  preference_pairs_per_sample: 4
  pair_selection: reward_gap
  dpo_beta: 0.1
  use_environment_step: true
  environment_steps_per_pair: 2
  max_new_tokens: 256
  discount: 1.0
  joint_mode: aligned
  early_termination_threshold: null
  rollout_buffer_size: 4
  train_batch_size: 4
  advantage_normalization: true
  eval_interval: 20
  eval_num_samples: 200
  eval_batch_size: 1

reward_processor:
  enabled: true
  scale_factor: 1.0
  shift: 0.0

wandb:
  project: comlrl
  entity: OpenMLRL
  name: tldr-madpo
  dir: output_madpo_tldr
  tags:
  - madpo
  - tldr
  - multi-agent
  - turns_1
