agent_model:
  name: Qwen/Qwen3-1.7B
  type: qwen
  temperature: 0.7
  top_p: 0.9
  top_k: null
  special_tokens: {}
  torch_dtype: auto

agents: null

dataset:
  name: trl-lib/tldr
  type: tldr
  train_split: train[:160]
  eval_split: test[:160]

tokenizer:
  padding_side: left

seed: 42

output:
  base_dir: output_marlhf_iter_tldr
  verbose: false
  save_final_model: false

marlhf_iter:
  parallel_training: none
  agent_devices:
  - cuda:0
  num_agents: 2
  num_turns: 1
  num_iterations: 4
  preference_replay_mode: current
  preference_replay_k: null
  preference_replay_lambda: null
  preference_replay_sample_size: null
  log_reward_distribution: false
  preference_scoring_reward: task
  policy_checkpoint_dir: null
  num_train_epochs: 2
  agent_learning_rate: 5.0e-06
  logging_steps: 50
  num_generations: 4
  preference_num_candidates: 20
  comparator_policy: current
  comparator_generation_mode: decentralized
  comparator_centralized_agent_index: 0
  comparator_model_name: null
  comparator_agents: null
  comparator_devices: null
  comparator_num_candidates: null
  comparator_history_k: null
  comparator_api_url: null
  comparator_api_format: generic
  comparator_api_model: null
  comparator_api_max_n_per_request: null
  comparator_api_key_env: null
  preference_pairs_per_sample: 4
  pair_selection: comparator_reward
  dpo_beta: 0.1
  use_environment_step: true
  environment_steps_per_pair: 2
  rl_algorithm: magrpo
  reward_model_name: null
  reward_model_device: cuda:0
  reward_learning_rate: 1.0e-05
  reward_num_train_epochs: 4
  reward_train_batch_size: 4
  reward_max_length: 1024
  reward_freeze_backbone: false
  max_new_tokens: 256
  discount: 1.0
  joint_mode: aligned
  early_termination_threshold: null
  rollout_buffer_size: 4
  train_batch_size: 4
  advantage_normalization: true
  eval_interval: 20
  eval_num_samples: 160
  eval_batch_size: 1

reward_processor:
  enabled: true
  scale_factor: 1.0
  shift: 0.0

wandb:
  project: comlrl
  entity: OpenMLRL
  name: tldr-marlhf-iter-current
  dir: output_marlhf_iter_tldr
  tags:
  - marlhf_iter
  - tldr
  - multi-agent
  - turns_1
  - iterative
