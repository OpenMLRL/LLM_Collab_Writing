agent_model:
  name: Qwen/Qwen3-1.7B
  type: qwen
  temperature: 0.7
  top_p: 0.9
  top_k: null
  special_tokens: {}
  torch_dtype: auto

agents: null

dataset:
  name: OpenMLRL/arXiv_abstract
  type: arxiv
  train_split: train[:1100]
  eval_split: val[:1100]

tokenizer:
  padding_side: left

seed: 42

output:
  base_dir: output_marlhf_arxiv
  verbose: false
  save_final_model: false

marlhf:
  parallel_training: none
  agent_devices:
  - cuda:0
  num_agents: 2
  num_turns: 1
  num_train_epochs: 2
  agent_learning_rate: 5.0e-06
  logging_steps: 50
  num_generations: 4
  preference_num_candidates: 20
  preference_pairs_per_sample: 4
  pair_selection: reward_gap
  dpo_beta: 0.1
  use_environment_step: true
  environment_steps_per_pair: 2
  rl_algorithm: magrpo
  reward_model_name: null
  reward_model_device: cuda:0
  reward_learning_rate: 1.0e-05
  reward_num_train_epochs: 2
  reward_train_batch_size: 4
  reward_max_length: 1024
  reward_freeze_backbone: false
  max_new_tokens: 256
  discount: 1.0
  joint_mode: aligned
  early_termination_threshold: null
  rollout_buffer_size: 4
  train_batch_size: 4
  advantage_normalization: true
  eval_interval: 20
  eval_num_samples: 4
  eval_batch_size: 1

reward_processor:
  enabled: true
  scale_factor: 1.0
  shift: 0.0

wandb:
  project: comlrl
  entity: OpenMLRL
  name: arxiv-marlhf
  dir: output_marlhf_arxiv
  tags:
  - marlhf
  - arxiv
  - multi-agent
  - turns_1

